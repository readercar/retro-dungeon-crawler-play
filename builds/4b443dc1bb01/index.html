<!-- TT Softs launch -->
<div id="TTSoftsLaunch">
  <img id="TTSoftsLaunchImage" src="tt-softs-ci.png" alt="TT Softs" fetchpriority="high" draggable="false">
</div>
<script>/* Installed inline before Cocos starts, so the approved company CI owns first paint. */
(() => {
  const overlay = document.getElementById('TTSoftsLaunch');
  const logo = document.getElementById('TTSoftsLaunchImage');
  if (!overlay || !logo) return;

  const holdMs = 2000;
  let visibleAt;
  let completion;
  const imageReady = new Promise(resolve => {
    let settled = false;
    const settle = loaded => {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      logo.removeEventListener('load', loadedImage);
      logo.removeEventListener('error', failedImage);
      if (loaded) visibleAt = performance.now();
      resolve();
    };
    const loadedImage = () => settle(true);
    const failedImage = () => settle(false);
    // A missing or stalled image must never prevent entry to the game.
    const timeout = setTimeout(failedImage, 5000);
    logo.addEventListener('load', loadedImage);
    logo.addEventListener('error', failedImage);
    if (logo.complete) settle(logo.naturalWidth > 0);
  });
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  window.__wdCompanyLaunch = {
    finish() {
      if (!completion) completion = (async () => {
        await imageReady;
        if (visibleAt !== undefined) {
          await delay(Math.max(0, holdMs - (performance.now() - visibleAt)));
          overlay.classList.add('is-leaving');
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) await delay(280);
        }
        overlay.remove();
      })();
      return completion;
    },
  };
})();
</script>
<!-- /TT Softs launch -->
